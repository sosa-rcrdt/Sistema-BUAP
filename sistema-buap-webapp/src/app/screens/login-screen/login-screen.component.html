<section class="login-page">
  <div class="login-layout">
    <!-- Columna izquierda con fondo y logos -->
    <div class="login-left">
      <div class="login-left-inner">
        <img src="/assets/images/Buap.png" alt="BUAP" class="login-logo-buap" />
        <img src="/assets/images/FCCBuap.png" alt="Facultad de Ciencias de la Computación" class="login-logo-fcc" />
      </div>
    </div>

    <!-- Columna derecha con el formulario -->
    <div class="login-right">
      <div class="card login-card">
        <div class="card-body login-card-body">
          <h1 class="login-title">Inicio de sesión</h1>

          <form class="login-form" (ngSubmit)="login()">
            <!-- Correo -->
            <div class="form-field">
              <label class="form-label" for="email">Correo electrónico</label>
              <input
                type="email"
                [(ngModel)]="username"
                name="email"
                id="email"
                class="form-control"
                placeholder="Correo electrónico"
              />
              <!-- Si quieres mostrar error:
              <div *ngIf="errors.username" class="invalid-feedback">
                {{ errors.username }}
              </div>
              -->
            </div>

            <!-- Contraseña -->
            <div class="form-field">
              <label class="form-label" for="password">Contraseña</label>
              <div class="password-wrapper">
                <input
                  [type]="type"
                  [(ngModel)]="password"
                  id="password"
                  name="password_user"
                  class="form-control password-input"
                  placeholder="Contraseña"
                  (keyup.enter)="login()"
                />
                <button
                  type="button"
                  class="password-toggle"
                  (click)="showPassword()"
                  aria-label="Mostrar u ocultar contraseña"
                >
                  <i *ngIf="type === 'password'" class="bi bi-eye-fill"></i>
                  <i *ngIf="type === 'text'" class="bi bi-eye-slash-fill"></i>
                </button>
              </div>
              <div *ngIf="errors.password" class="invalid-feedback">
                {{ errors.password }}
              </div>
            </div>

            <!-- Olvidé mi contraseña (texto por ahora, sin lógica) -->
            <button type="button" class="login-link">
              Olvidé mi contraseña
            </button>

            <!-- Acciones -->
            <div class="login-actions">
              <button class="btn btn-primary" type="submit">
                Iniciar sesión
              </button>

              <button type="button" class="login-link" (click)="registrar()">
                Registrarse
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
