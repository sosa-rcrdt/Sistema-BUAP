<div class="charts-home">
<!-- Navbar -->
<header class="charts-home-header">
    <app-navbar></app-navbar>
</header>

<!-- Contenido principal -->
<main class="charts-home-main page">
    <!-- Bloque de bienvenida / título -->
    <section class="charts-hero">
    <div class="charts-hero-text">
        <h1 class="charts-hero-title">Análisis de datos del sistema</h1>
        <p class="charts-hero-subtitle">
        Visualiza el comportamiento de materias y usuarios registrados.
        </p>
    </div>
    </section>

    <!-- Sección: Análisis de materias -->
    <section class="charts-section card">
    <div class="card-header charts-section-header">
        <div>
        <h2 class="card-title">Análisis de materias</h2>
        <p class="card-subtitle">
            Registros de materias por día y alumnos por materia.
        </p>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-item">
        <canvas
            baseChart
            type="line"
            [data]="lineChartData"
            [plugins]="lineChartPlugins"
            [options]="lineChartOption"
        ></canvas>
        </div>

        <div class="chart-item">
        <canvas
            baseChart
            type="bar"
            [data]="barChartData"
            [plugins]="barChartPlugins"
            [options]="barChartOption"
        ></canvas>
        </div>
    </div>
    </section>

    <!-- Sección: Análisis de usuarios -->
    <section class="charts-section card">
    <div class="card-header charts-section-header">
        <div>
        <h2 class="card-title">Análisis de usuarios</h2>
        <p class="card-subtitle">
            Distribución de administradores, maestros y alumnos en el sistema.
        </p>
        </div>
    </div>

    <div class="charts-center">
        <div class="chart-item chart-item-lg">
        <canvas
            baseChart
            type="doughnut"
            [data]="doughnutChartData"
            [plugins]="doughnutChartPlugins"
            [options]="doughnutChartOption"
        ></canvas>
        </div>
    </div>
    </section>
</main>
</div>
