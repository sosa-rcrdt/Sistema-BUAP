<div class="app-navbar">
<nav class="navbar navbar-expand-lg app-navbar-bar">
    <div class="container-fluid app-navbar-inner">
    <!-- Botón hamburguesa (mobile) -->
    <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
    >
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <!-- Links de navegación / Título de registro -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 app-navbar-links">
        <ng-container *ngIf="tipo != 'registro-usuarios'; else registraUsers">
            <li class="nav-item">
            <a
                class="nav-link active"
                id="principal"
                aria-current="page"
                (click)="clickNavLink('home')"
            >
                Inicio
            </a>
            </li>

            <li class="nav-item" *ngIf="rol != 'alumno'">
            <a
                class="nav-link"
                id="alumno"
                aria-current="page"
                (click)="clickNavLink('alumnos')"
            >
                Alumnos
            </a>
            </li>

            <li class="nav-item" *ngIf="rol != 'maestro' && rol != 'alumno'">
            <a
                class="nav-link"
                id="maestro"
                (click)="clickNavLink('maestros')"
            >
                Maestros
            </a>
            </li>

            <li class="nav-item">
            <a class="nav-link" id="graficas" (click)="clickNavLink('graficas')">
                Gráficas
            </a>
            </li>

            <li class="nav-item dropdown" *ngIf="rol != 'alumno'">
            <a
                class="nav-link dropdown-toggle"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
            >
                Registrar
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li>
                <a class="dropdown-item" (click)="goRegistro()">
                    Alumnos
                </a>
                </li>
                <li *ngIf="rol != 'maestro' && rol != 'alumno'">
                <a class="dropdown-item" (click)="goRegistro()">
                    Maestros
                </a>
                </li>
            </ul>
            </li>
        </ng-container>

        <ng-template #registraUsers>
            <span class="navbar-title" *ngIf="!editar">
            Registro de usuarios del sistema
            </span>
            <span class="navbar-title" *ngIf="editar">
            Editar usuario del sistema
            </span>
        </ng-template>
        </ul>

        <!-- Menú de usuario -->
        <div class="app-navbar-user" *ngIf="true">
        <div class="dropdown">
            <button
            class="user-menu-trigger btn dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            >
            <i class="bi bi-person-circle"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
            <li *ngIf="token != ''">
                <a class="dropdown-item" (click)="logout()">Cerrar sesión</a>
            </li>
            <li *ngIf="tipo == 'registro-usuarios' && token == ''">
                <a class="dropdown-item" href="#">Iniciar sesión</a>
            </li>
            </ul>
        </div>
        </div>
    </div>
    </div>
</nav>
</div>
